name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One step, not four: `npm run check` is the exact same sequence a developer runs locally.
      # Four separate steps let a local run diverge from CI by omission — which is how a
      # typecheck failure once reached main while the commit message said "all gates green".
      - run: npm run check

# CI never runs `test:live` — it has no credentials and must not hit Garmin.
