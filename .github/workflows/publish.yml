name: Publish

# Publishes to npm when a version tag is pushed: `git tag v0.2.0 && git push origin v0.2.0`.
# Can also be run by hand from the Actions tab against an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # attach the .mcpb to the tag's GitHub Release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest

      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Ref '$GITHUB_REF_NAME' is not the tag for package.json version $version"
            exit 1
          fi

      - run: npm ci
      # `npm publish` runs prepublishOnly, which is the ROOT `npm run check` — the same gate CI
      # runs, and (because this is a workspace) it also runs `check -w mcp`, which is what
      # actually executes tests/mcp-package.test.ts's version-lockstep assertion.
      # No token: npm authenticates through trusted publishing (configured on npmjs.com for
      # DynamicsNinja/garminconnect-js + publish.yml) and attaches provenance automatically.
      - run: npm publish

      # The MCP server ships from the same tag, AFTER the library. tests/mcp-package.test.ts (run by
      # the root prepublishOnly above) guarantees its version equals the library's.
      #
      # Skip if this version is already on npm, so a re-run after a partial failure (e.g. the
      # library publish above succeeded but this step failed or the job was cancelled) and a
      # manual first publish both work without erroring on "you cannot publish over the previously
      # published version".
      #
      # FIRST RELEASE SEQUENCE (trusted publishing can't be configured for a package that doesn't
      # exist on npm yet): 1) the maintainer publishes @dynamicsninja/garminconnect-mcp once by hand, with a
      # token, at the version this tag names (`npm publish -w mcp`); 2) THEN configure this repo +
      # publish.yml as its trusted publisher on npmjs.com; 3) only then push the `vX.Y.Z` tag that
      # triggers this workflow — by that point this step is a no-op (the version already exists)
      # and just confirms it.
      - name: Publish mcp (skip if this version is already published)
        run: |
          version="$(node -p "require('./mcp/package.json').version")"
          if ! npm view @dynamicsninja/garminconnect-mcp name >/dev/null 2>&1; then
            # Not on npm at all yet: trusted publishing cannot work for it, so attempting it only
            # fails after the library has already shipped. Say so loudly and leave it to the
            # maintainer's one-time manual publish described above.
            echo "::warning::@dynamicsninja/garminconnect-mcp is not on npm yet. Publish $version once by hand (npm publish -w mcp), then configure trusted publishing for it."
          elif npm view "@dynamicsninja/garminconnect-mcp@$version" version >/dev/null 2>&1; then
            echo "@dynamicsninja/garminconnect-mcp@$version is already published; skipping."
          else
            npm publish -w mcp
          fi

      # The Claude Desktop Extension, attached to this tag's GitHub Release.
      - name: Build Desktop Extension
        run: |
          npm run build -w mcp
          npm run build:mcpb -w mcp
      - name: Attach it to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file="$(ls mcp/dist-mcpb/*.mcpb)"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$file" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$file" --verify-tag --generate-notes
          fi
